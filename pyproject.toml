[project]
name = "market-data-mcp"
version = "0.1.0"
description = "Market data MCP powered by Yahoo Finance"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==3.4.5",
    "httpx==0.28.1",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "python-jose[cryptography]==3.5.0",
    "uvicorn==0.51.0",
    "yfinance>=0.2.50,<1",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
